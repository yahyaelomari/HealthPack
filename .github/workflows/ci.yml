name: CI

# Two triggers, doing two different jobs:
#   pull_request -> gate the merge: nothing merges if this fails
#   push to main -> confirm main is still green after the merge lands
#                    (also where a future deploy/image-push step would hang off)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testcontainers needs Docker; GitHub-hosted ubuntu runners ship it
      # already running, so no extra setup step is needed here.
      - name: Build and test
        run: ./mvnw -B verify
