# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=chat-service
server.port=${SERVER_PORT:8513}
spring.threads.virtual.enabled=true

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/chat}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema; Hibernate may only check that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
# The JWT is validated once during the WebSocket handshake; after that the
# connection is already authenticated and per-destination rules take over
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── WebSocket / STOMP ────────────────────────────────────────────────────────
healthpack.chat.websocket.endpoint=/ws/chat
healthpack.chat.websocket.application-prefix=/app
healthpack.chat.websocket.broker-prefix=/topic,/queue
# Relaying through RabbitMQ's STOMP plugin means messages reach subscribers
# connected to any instance, not just this one
healthpack.chat.stomp-relay.enabled=${STOMP_RELAY_ENABLED:true}
healthpack.chat.stomp-relay.host=${RABBITMQ_HOST:localhost}
healthpack.chat.stomp-relay.port=${RABBITMQ_STOMP_PORT:61613}
healthpack.chat.stomp-relay.login=${RABBITMQ_USERNAME:healthpack}
healthpack.chat.stomp-relay.passcode=${RABBITMQ_PASSWORD:healthpack}

# ── gRPC client (streams answers from ai-service) ────────────────────────────
spring.grpc.client.channel.ai.target=${AI_GRPC_TARGET:static://localhost:9514}

# ── Redis (presence) ─────────────────────────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
healthpack.chat.presence.ttl=30s

# ── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── RabbitMQ (falls back to a push notification when the recipient is offline) ─
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:healthpack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:healthpack}
spring.rabbitmq.template.observation-enabled=true

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
