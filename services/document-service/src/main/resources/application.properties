# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=document-service
server.port=${SERVER_PORT:8510}
spring.threads.virtual.enabled=true

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/document}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema; Hibernate may only check that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── RabbitMQ (render commands arrive here) ───────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:healthpack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:healthpack}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
# Rendering a PDF is slow, so take one job at a time per consumer
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# ── Kafka (publishes extracted text for RAG ingestion) ───────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── Object storage (any S3-compatible server) ────────────────────────────────
healthpack.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
healthpack.storage.region=${S3_REGION:us-east-1}
healthpack.storage.bucket=${S3_BUCKET:healthpack-documents}
healthpack.storage.access-key=${S3_ACCESS_KEY:healthpack}
healthpack.storage.secret-key=${S3_SECRET_KEY:healthpack-secret}
# MinIO and friends need path-style addressing; real S3 does not
healthpack.storage.path-style-access=true
healthpack.storage.presigned-url-ttl=15m

# ── PDF ──────────────────────────────────────────────────────────────────────
healthpack.pdf.template-path=classpath:/templates/pdf/
# PDF/A is the archival profile; signing proves the file has not been altered since
healthpack.pdf.pdfa-conformance=PDFA_2_U
healthpack.pdf.signing.enabled=${PDF_SIGNING_ENABLED:false}
healthpack.pdf.signing.keystore-path=${PDF_SIGNING_KEYSTORE:}
healthpack.pdf.signing.keystore-password=${PDF_SIGNING_KEYSTORE_PASSWORD:}

# Templates are only rendered to PDF, never served as web pages
spring.thymeleaf.cache=true

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# ── API docs ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
