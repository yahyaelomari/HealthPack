# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=ai-service
server.port=${SERVER_PORT:8514}
spring.threads.virtual.enabled=true

# ── PostgreSQL + pgvector (one database per service) ─────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema, including CREATE EXTENSION vector and the chunk table
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── Claude ───────────────────────────────────────────────────────────────────
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.options.model=claude-opus-5
spring.ai.anthropic.chat.options.max-tokens=16000
# Do not set temperature, top-p or top-k: Opus 5 rejects all three with a 400.
# Thinking is adaptive by default; control depth through output-config effort.
# Haiku handles ingest-time summarisation, where volume is high and judgement is low.
healthpack.ai.summarisation-model=claude-haiku-4-5

# ── Embeddings (Voyage AI) ───────────────────────────────────────────────────
# Anthropic has no embeddings endpoint, and Spring AI ships no Voyage
# integration, so the EmbeddingModel here is yours to implement over RestClient.
spring.ai.model.embedding=none
healthpack.ai.embedding.base-url=${VOYAGE_BASE_URL:https://api.voyageai.com/v1}
healthpack.ai.embedding.api-key=${VOYAGE_API_KEY:}
healthpack.ai.embedding.model=${VOYAGE_MODEL:voyage-3.5}

# ── Vector store ─────────────────────────────────────────────────────────────
# Dimensions must match whatever the embedding model returns, and the column
# width is fixed once rows exist — changing model means a re-index.
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=${EMBEDDING_DIMENSIONS:1024}
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# ── Retrieval ────────────────────────────────────────────────────────────────
healthpack.ai.retrieval.top-k=8
healthpack.ai.retrieval.similarity-threshold=0.7
healthpack.ai.chunking.max-tokens=512
healthpack.ai.chunking.overlap-tokens=64
# An answer with no retrieved context must refuse, never improvise
healthpack.ai.refuse-without-context=true

# ── gRPC ─────────────────────────────────────────────────────────────────────
# Streams answer tokens to chat-service
spring.grpc.server.port=${GRPC_PORT:9514}
spring.grpc.server.servlet.enabled=false
# Consent is checked on every single question and is never cached
spring.grpc.client.channel.identity.target=${IDENTITY_GRPC_TARGET:static://localhost:9501}

# ── Kafka (ingests document text as it is extracted) ─────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# ── API docs ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html

# ── Not yet wired ────────────────────────────────────────────────────────────
# PgVectorStore's auto-configuration needs an EmbeddingModel bean, and there is
# none until you write the Voyage one. Delete this line at that point.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
