spring.application.name=patient-service
server.port=${SERVER_PORT:8502}
spring.threads.virtual.enabled=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/patient}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema; Hibernate may only check that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Keys come from jwk-set-uri, the issuer is validated against issuer-uri. Inside
# Docker the reachable hostname differs from the issuer baked into the token, so
# the two have to be set separately.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

spring.grpc.server.port=${GRPC_PORT:9502}
# Keep gRPC on its own port instead of sharing the servlet container
spring.grpc.server.servlet.enabled=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

springdoc.swagger-ui.path=/swagger-ui.html
