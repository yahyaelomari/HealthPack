# --- Service ---
spring.application.name=edge-gateway
server.port=${SERVER_PORT:8500}

# --- Routes ---
# terminology-service is deliberately absent: it speaks gRPC only and is never
# reachable from outside the cluster.
spring.cloud.gateway.server.webflux.routes[0].id=identity-service
spring.cloud.gateway.server.webflux.routes[0].uri=${IDENTITY_SERVICE_URI:http://localhost:8501}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/identity/**,/api/v1/consents/**

spring.cloud.gateway.server.webflux.routes[1].id=patient-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PATIENT_SERVICE_URI:http://localhost:8502}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/patients/**

spring.cloud.gateway.server.webflux.routes[2].id=scheduling-service
spring.cloud.gateway.server.webflux.routes[2].uri=${SCHEDULING_SERVICE_URI:http://localhost:8503}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/appointments/**,/api/v1/practitioners/**,/api/v1/slots/**

spring.cloud.gateway.server.webflux.routes[3].id=clinical-service
spring.cloud.gateway.server.webflux.routes[3].uri=${CLINICAL_SERVICE_URI:http://localhost:8504}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/encounters/**,/api/v1/observations/**,/api/v1/conditions/**

spring.cloud.gateway.server.webflux.routes[4].id=lab-service
spring.cloud.gateway.server.webflux.routes[4].uri=${LAB_SERVICE_URI:http://localhost:8505}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/lab-orders/**,/api/v1/lab-results/**

spring.cloud.gateway.server.webflux.routes[5].id=pharmacy-service
spring.cloud.gateway.server.webflux.routes[5].uri=${PHARMACY_SERVICE_URI:http://localhost:8506}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/v1/prescriptions/**,/api/v1/dispenses/**

spring.cloud.gateway.server.webflux.routes[6].id=billing-service
spring.cloud.gateway.server.webflux.routes[6].uri=${BILLING_SERVICE_URI:http://localhost:8507}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/v1/invoices/**,/api/v1/payments/**,/api/v1/webhooks/stripe

spring.cloud.gateway.server.webflux.routes[7].id=bff-graphql
spring.cloud.gateway.server.webflux.routes[7].uri=${BFF_GRAPHQL_URI:http://localhost:8509}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/graphql,/graphql/**,/graphiql/**

spring.cloud.gateway.server.webflux.routes[8].id=document-service
spring.cloud.gateway.server.webflux.routes[8].uri=${DOCUMENT_SERVICE_URI:http://localhost:8510}
spring.cloud.gateway.server.webflux.routes[8].predicates[0]=Path=/api/v1/documents/**

spring.cloud.gateway.server.webflux.routes[9].id=notification-service
spring.cloud.gateway.server.webflux.routes[9].uri=${NOTIFICATION_SERVICE_URI:http://localhost:8511}
spring.cloud.gateway.server.webflux.routes[9].predicates[0]=Path=/api/v1/notifications/**,/api/v1/push-subscriptions/**

spring.cloud.gateway.server.webflux.routes[10].id=audit-service
spring.cloud.gateway.server.webflux.routes[10].uri=${AUDIT_SERVICE_URI:http://localhost:8512}
spring.cloud.gateway.server.webflux.routes[10].predicates[0]=Path=/api/v1/audit/**

# Websocket upgrades are detected automatically, so an http:// target is correct here
spring.cloud.gateway.server.webflux.routes[11].id=chat-service
spring.cloud.gateway.server.webflux.routes[11].uri=${CHAT_SERVICE_URI:http://localhost:8513}
spring.cloud.gateway.server.webflux.routes[11].predicates[0]=Path=/ws/chat/**,/api/v1/chat/**

spring.cloud.gateway.server.webflux.routes[12].id=ai-service
spring.cloud.gateway.server.webflux.routes[12].uri=${AI_SERVICE_URI:http://localhost:8514}
spring.cloud.gateway.server.webflux.routes[12].predicates[0]=Path=/api/v1/ai/**

# --- Security (Keycloak) ---
# Keys come from jwk-set-uri, the issuer is validated against issuer-uri. Inside
# Docker the reachable hostname differs from the issuer baked into the token, so
# the two have to be set separately.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# --- Redis (backs the rate limiter) ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- Observability ---
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
