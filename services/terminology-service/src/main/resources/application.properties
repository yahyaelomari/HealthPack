# ── Service ──────────────────────────────────────────────────────────────────
# gRPC is the only API. The HTTP port exists purely so actuator has somewhere
# to live for health checks and metrics scraping.
spring.application.name=terminology-service
server.port=${SERVER_PORT:8508}
spring.threads.virtual.enabled=true

# ── gRPC server ──────────────────────────────────────────────────────────────
spring.grpc.server.port=${GRPC_PORT:9508}
spring.grpc.server.servlet.enabled=false

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/terminology}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema; Hibernate may only check that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Caching ──────────────────────────────────────────────────────────────────
# Caffeine is L1 (per instance). Redis is L2 and shared — wire it by hand, since
# Spring's cache abstraction only manages one level at a time.
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=50000,expireAfterWrite=1h
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
healthpack.terminology.l2-cache-ttl=24h

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
