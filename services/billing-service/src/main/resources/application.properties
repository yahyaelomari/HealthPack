# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=billing-service
server.port=${SERVER_PORT:8507}
spring.threads.virtual.enabled=true

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/billing}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema; Hibernate may only check that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── Stripe ───────────────────────────────────────────────────────────────────
# Test-mode keys only. The webhook signing secret is what proves a callback
# really came from Stripe, so treat it as the source of truth for payment state.
healthpack.stripe.api-key=${STRIPE_API_KEY:}
healthpack.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
healthpack.stripe.currency=eur

# ── Kafka (consumes encounter.closed) ────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── RabbitMQ (invoice PDFs) ──────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:healthpack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:healthpack}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# ── API docs ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
