# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=clinical-service
server.port=${SERVER_PORT:8504}
spring.threads.virtual.enabled=true

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinical}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema; Hibernate may only check that it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── gRPC ─────────────────────────────────────────────────────────────────────
# Serves BatchGetEncounters to the BFF
spring.grpc.server.port=${GRPC_PORT:9504}
spring.grpc.server.servlet.enabled=false
# Validates every clinical code before it is stored
spring.grpc.client.channel.terminology.target=${TERMINOLOGY_GRPC_TARGET:static://localhost:9508}
# Checks the patient exists before an encounter is opened
spring.grpc.client.channel.patient.target=${PATIENT_GRPC_TARGET:static://localhost:9502}

# ── Kafka ────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# ── API docs ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
