# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=bff-graphql
server.port=${SERVER_PORT:8509}
spring.threads.virtual.enabled=true

# ── GraphQL ──────────────────────────────────────────────────────────────────
spring.graphql.http.path=/graphql
spring.graphql.websocket.path=/graphql
spring.graphql.schema.locations=classpath:graphql/
# Schema inspection reports resolvers that no longer match the schema at startup
spring.graphql.schema.inspection.enabled=true
# GraphiQL is a development tool; turn it off in the production profile
spring.graphql.graphiql.enabled=${GRAPHIQL_ENABLED:true}
spring.graphql.graphiql.path=/graphiql

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── Downstream services ──────────────────────────────────────────────────────
# gRPC where a batch endpoint exists, so DataLoader can collapse N field fetches
# into one call per service
spring.grpc.client.channel.patient.target=${PATIENT_GRPC_TARGET:static://localhost:9502}
spring.grpc.client.channel.clinical.target=${CLINICAL_GRPC_TARGET:static://localhost:9504}

# Plain REST for the rest
healthpack.services.scheduling.url=${SCHEDULING_SERVICE_URI:http://localhost:8503}
healthpack.services.lab.url=${LAB_SERVICE_URI:http://localhost:8505}
healthpack.services.pharmacy.url=${PHARMACY_SERVICE_URI:http://localhost:8506}

# ── Query limits ─────────────────────────────────────────────────────────────
healthpack.graphql.max-query-depth=10
healthpack.graphql.max-query-complexity=200

# ── Kafka (feeds subscriptions) ──────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
