# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=notification-service
server.port=${SERVER_PORT:8511}
spring.threads.virtual.enabled=true

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notification}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema — including the unique constraint on dedupe_key that
# stops the same alert going out twice
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── RabbitMQ (send commands) ─────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:healthpack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:healthpack}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# ── Kafka (critical values arrive on their own topic) ────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── Email (Mailpit in development: a fake SMTP server with a web inbox) ──────
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
healthpack.notification.mail.from=no-reply@healthpack.test

# ── Web push (VAPID) ─────────────────────────────────────────────────────────
# Generate a key pair once and keep the private key out of git
healthpack.notification.web-push.public-key=${VAPID_PUBLIC_KEY:}
healthpack.notification.web-push.private-key=${VAPID_PRIVATE_KEY:}
healthpack.notification.web-push.subject=mailto:admin@healthpack.test

# ── Delivery rules ───────────────────────────────────────────────────────────
healthpack.notification.quiet-hours.enabled=true
# Critical lab values are the one thing allowed to ignore quiet hours
healthpack.notification.quiet-hours.bypass-priority=CRITICAL
healthpack.notification.retry.max-attempts=5
healthpack.notification.retry.initial-backoff=5s

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# ── API docs ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
