# ── Service ──────────────────────────────────────────────────────────────────
spring.application.name=scheduling-service
server.port=${SERVER_PORT:8503}
spring.threads.virtual.enabled=true

# ── PostgreSQL (one database per service) ────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scheduling}
spring.datasource.username=${DB_USERNAME:healthpack}
spring.datasource.password=${DB_PASSWORD:healthpack}

# Flyway owns the schema — including the exclusion constraint that makes
# double-booking impossible to store in the first place
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ── Security (Keycloak) ──────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8580/realms/healthpack}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8580/realms/healthpack/protocol/openid-connect/certs}

# ── gRPC client ──────────────────────────────────────────────────────────────
spring.grpc.client.channel.patient.target=${PATIENT_GRPC_TARGET:static://localhost:9502}

# ── Kafka (facts) ────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true

# ── RabbitMQ (commands) ──────────────────────────────────────────────────────
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:healthpack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:healthpack}
# Rejected messages must reach the dead-letter exchange, not loop back into the queue
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# ── Redis (short-lived slot holds; correctness lives in the DB constraint) ───
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ── Reminder sweep ───────────────────────────────────────────────────────────
healthpack.scheduling.reminder.lead-time=24h
healthpack.scheduling.reminder.sweep-interval=5m
healthpack.scheduling.slot-hold.ttl=2m

# ── Observability ────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OTLP_ENDPOINT:http://localhost:4318}/v1/metrics

# ── API docs ─────────────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
