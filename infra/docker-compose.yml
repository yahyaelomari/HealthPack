# Local infrastructure for HealthPack. Every port and credential here matches the
# defaults in each service's application.properties, so services run from the IDE
# with no extra configuration.
#
#   docker compose -f infra/docker-compose.yml up -d

name: healthpack

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: healthpack-postgres
    environment:
      POSTGRES_USER: healthpack
      POSTGRES_PASSWORD: healthpack
      POSTGRES_DB: healthpack
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs only on first start, when the data volume is empty
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthpack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: healthpack-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.1.0
    container_name: healthpack-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single node, so nothing can be replicated anywhere else
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: healthpack-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: healthpack
      RABBITMQ_DEFAULT_PASS: healthpack
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
      - "61613:61613"   # STOMP, used by chat-service's broker relay
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: healthpack-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      # 8580 on the host, because the services' issuer-uri points there
      - "8580:8080"
    volumes:
      # Export the realm to this directory so the setup is reproducible
      - ./keycloak:/opt/keycloak/data/import

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: healthpack-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    # Pulled from quay.io: the Docker Hub repository is no longer public
    image: quay.io/minio/minio:latest
    container_name: healthpack-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: healthpack
      MINIO_ROOT_PASSWORD: healthpack-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data

  observability:
    # Grafana, Tempo, Loki and Prometheus in a single container
    image: grafana/otel-lgtm:latest
    container_name: healthpack-observability
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    volumes:
      - observability-data:/data

volumes:
  postgres-data:
  kafka-data:
  rabbitmq-data:
  minio-data:
  observability-data:
